spring.datasource.url=jdbc:mysql://localhost:3306/lawappbackend?useUnicode=true&useJDBCCompliantTimezoneShift=true&createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
##############################
# JPA / Hibernate
##############################
# Change from 'none' to 'update' for development to allow Hibernate to create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Use the more modern MySQL8 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect